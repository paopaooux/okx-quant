[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okx-quant"
version = "0.1.0"
description = "OKX simulated perpetual trading ledger and reporting tool"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
okx-quant = "scripts.live.okx_demo:main"

[tool.setuptools.packages.find]
include = ["scripts*"]
