name: okx-quant

services:
  backtest:
    build:
      context: .
      # Linux builds can use the host's local Clash listener for package
      # downloads.  This affects build networking only.
      network: host
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-http://127.0.0.1:7890}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-http://127.0.0.1:7890}
    image: okx-quant:backtest
    restart: "no"
    network_mode: host
    volumes:
      # The pre-backtest Binance tail updater needs to append confirmed rows.
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./results:/app/results
    environment:
      BINANCE_PROXY_URL: ${OKX_PROXY_URL:-http://127.0.0.1:7890}
    command: ["sh", "-c", "python scripts/data/update_binance_tail.py && python -m scripts.combinations.run"]

  okx-quant:
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-http://127.0.0.1:7890}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-http://127.0.0.1:7890}
    image: okx-quant:demo
    container_name: okx-quant
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      AUTO_TRADE: "true"
      AUTO_CONFIG: "c"
      AUTO_TAIL: "0.01"
      AUTO_MODEL_TAG: "c_roll730"
      AUTO_MAX_POSITIONS: "5"
      AUTO_SLOT_WEIGHT: "0.20"
      AUTO_DYNAMIC_SIZE: "true"
      AUTO_DYNAMIC_SIZE_FALLBACK: "skip"
      AUTO_POSITION_MODE: "net_mode"
      AUTO_INTERVAL: "30"
      AUTO_MAX_HOLD_BARS: "48"
      AUTO_STOCK_STOP_BPS: "300"
      AUTO_STOCK_MAX_HOLD_HOURS: "30"
      OKX_DEMO_DB: /app/data/okx_demo.sqlite3
      AUTO_STOCK_DATA: /app/data/stocks_swap
      STOCK_CANDLE_INTERVAL: "300"
      STOCK_HISTORY_DAYS: "18"
      OKX_CRYPTO_HISTORY_DAYS: "30"
      OKX_CRYPTO_INTERVAL: "60"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./results:/app/results:ro
    command: ["python", "scripts/live/run_all.py"]
